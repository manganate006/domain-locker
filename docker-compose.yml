# Domain Locker Fork - avec import automatique depuis registrars
# Fork de https://github.com/Lissy93/domain-locker
# Ajout: Support API OVH, Hostinger, GoDaddy, Cloudflare, Namecheap, etc.

services:
  postgres:
    image: postgres:15-alpine
    container_name: domain-locker-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DL_PG_NAME:-domain_locker}
      POSTGRES_USER: ${DL_PG_USER:-postgres}
      POSTGRES_PASSWORD: ${DL_PG_PASSWORD:-changeme2420}

    ports:
      - "${DL_PG_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Initialisation du schéma avec la table registrar_accounts
      - ./db/schema.sql:/docker-entrypoint-initdb.d/init-schema.sql:ro
    networks:
      - domain_locker_network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DL_PG_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: domain-locker-fork:latest
    container_name: domain-locker-app
    restart: unless-stopped
    environment:
      DL_ENV_TYPE: ${DL_ENV_TYPE:-selfHosted}
      DL_PG_HOST: ${DL_PG_HOST:-postgres}
      DL_PG_PORT: ${DL_PG_PORT:-5432}
      DL_PG_USER: ${DL_PG_USER:-postgres}
      DL_PG_PASSWORD: ${DL_PG_PASSWORD:-changeme2420}
      DL_PG_NAME: ${DL_PG_NAME:-domain_locker}
      # Clé de chiffrement pour les credentials registrars (optionnel)
      DL_ENCRYPTION_KEY: ${DL_ENCRYPTION_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - domain_locker_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.domainlocker.rule=Host(`domain-locker.local`)"
      - "traefik.http.routers.domainlocker.entrypoints=http"
      - "traefik.http.services.domainlocker.loadbalancer.server.port=3000"

  updater:
    image: alpine:3.20
    container_name: domain-locker-updater
    restart: unless-stopped
    depends_on:
      - app
    networks:
      - domain_locker_network
    environment:
      # Clé API pour l'autofetch des domaines depuis les registrars
      # Récupérez cette clé depuis Settings > Registrar Accounts dans l'interface
      DL_AUTOFETCH_KEY: ${DL_AUTOFETCH_KEY:-}
    command: >
      /bin/sh -c "
        apk add --no-cache curl &&
        echo '0 3 * * * /usr/bin/curl -s -X POST http://app:3000/api/domain-updater' > /etc/crontabs/root &&
        echo '0 4 * * * /usr/bin/curl -s -X POST http://app:3000/api/expiration-reminders' >> /etc/crontabs/root &&
        if [ -n \"$$DL_AUTOFETCH_KEY\" ]; then
          echo '0 5 * * * /usr/bin/curl -s -X POST http://app:3000/api/registrar-autofetch?key='$$DL_AUTOFETCH_KEY >> /etc/crontabs/root
        fi &&
        crond -f -L /dev/stdout
      "

volumes:
  postgres_data:
    name: domain_locker_postgres_data
    external: false

networks:
  domain_locker_network:
    driver: bridge
